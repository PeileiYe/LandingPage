<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="css/style.css">
  <link rel="shortcut icon" href="img/favicon.jpg" type="image/x-icon">
  <title>Contact</title>
</head>
<body class="contact">
    <div class="formBox">
        <h1>Contact Me</h1>
        <form action="mailto:ye.peilei@gmail.com" method="POST">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="youremail@gmail.com" required>

            <label for="name">Telephone:</label>
            <input type="text" id="telephone" name="telephone" placeholder="+34 666666666">
            
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="6" required></textarea>
            
            <button type="submit">Send Message</button>
        </form>
    </div>
    <div class="copyright">
        <p>&copy; 2025 Peilei Ye Jin | Personal Website. All rights reserved.</p>
    </div>

</body>
</html>
